# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches:
      - main
  pull_request:
    branches: 
      - main
  workflow_dispatch:  # Enables manual triggering
    inputs:
      target_service:
        description: 'Input a service name (e.g., demo-app)'
        required: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Workflow 
        run: |

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/achan-cogito/test-git-workflow/dispatches \
            -d "{\"event_type\": \"trigger_workflow_spec_updated\", \"client_payload\": {\"message\": \"AdminService_API_Spec.yaml has been updated\"}}"
